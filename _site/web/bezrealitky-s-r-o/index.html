  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Yellow — Digital Hub</title>
  <meta name="description" content="A clean hub for my work: drone, video, and projects." />

  <link rel="stylesheet" href="/assets/style.css">
  

  <link rel="canonical" href="https://iamyellow.dev/web/bezrealitky-s-r-o/" />

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Go home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Yellow</span>
    </a>

    <nav class="nav">
      <a href="/#focus">Focus</a>
      <a href="/#paths">Explore</a>
      <a href="/projects/">Projects</a>
      <a href="/#links">Links</a>
    </nav>
  </header>

  <main id="top" style="padding-top: 70px;">
    
<div class="container mx-auto px-4 py-8" x-data="{ maxPrice: 20000000 }">
    <!-- Profil makléře -->
    <div class="flex flex-col md:flex-row gap-8 items-center bg-white p-6 rounded-xl shadow-sm mb-12">
        <img src="/assets/images/export_makleri/92241.jpg" 
             alt="Bezrealitky s.r.o" 
             class="w-48 h-48 rounded-full object-cover shadow-md"
             onerror="this.src='/assets/images/potensic-fallback.jpg.jpg'">
        
        <div>
            <h1 class="text-3xl font-bold">Bezrealitky s.r.o</h1>
            <p class="text-blue-600 font-medium">Realitní makléř</p>
            <div class="mt-4 flex gap-4">
                <a href="mailto:inzerce@bezrealitky.cz" class="text-gray-600 hover:text-blue-600 flex items-center gap-2">
                    <span>📧</span> inzerce@bezrealitky.cz
                </a>
            </div>
            <a href="https://www.realitniservery.cz/realitni-makleri/bezrealitky-sro-92241/" target="_blank" class="mt-4 inline-block text-sm text-gray-400 underline">
                Původní profil na RealitníServery.cz
            </a>
        </div>
    </div>

    <!-- Filtr ceny (pomocí Alpine.js pro okamžitou reakci) -->
    <div class="mb-8 bg-gray-50 p-4 rounded-lg">
        <label class="block text-sm font-bold mb-2">Filtrovat podle ceny: <span x-text="new Intl.NumberFormat('cs-CZ').format(maxPrice)"></span> Kč</label>
        <input type="range" min="0" max="30000000" step="500000" x-model="maxPrice" class="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer">
    </div>

    <!-- Seznam nabídek -->
    <h2 class="text-2xl font-bold mb-6">Aktuální nabídky</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <p class="text-gray-500 italic">Tento makléř momentálně nemá žádné veřejné nabídky.</p>
        
    </div>
</div>

  </main>

  <script src="/assets/app.js" defer></script>
  
</body>
