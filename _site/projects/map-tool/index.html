<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Firms Without a Website — Yellow</title>
  <meta name="description" content="Click the map → set radius → start scan. Grid scan covers multiple points." />

  <link rel="stylesheet" href="/assets/style.css">
  
  <link rel="stylesheet" href="/assets/map-tool.css">
  

  <link rel="canonical" href="https://iamyellow.dev/projects/map-tool/" />

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="theme-color" content="#0B0C10">

  <script defer src="/js/smooth-water-ripples.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Go home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Yellow</span>
    </a>

    <nav class="nav">
      <a href="/#focus">Focus</a>
      <a href="/#paths">Explore</a>
      <a href="/projects/">Projects</a>
      <a href="/#links">Links</a>
    </nav>
  </header>

  <main id="top" style="padding-top: 70px;">
    
<div class="container">
  <h1>Firms Without a Website</h1>

  <div id="subtitle">
    Click the map → set radius → start scan. Grid scan covers multiple points.
  </div>

  <div class="controls">
    <div class="control-row">
      <label>📍 Click on the map</label>

      <label>
        Radius: <span id="radiusValue">10 km</span>
      </label>
      <input type="range" id="radiusSlider" min="2" max="50" value="10" />

      <label>
        Target:
        <input type="number" id="targetInput" min="1" max="1000" value="20" />
      </label>

      <button id="btnSearch" class="max" disabled>🔥 START GRID SCAN</button>
    </div>

    <div class="control-row">
      <span>
        Progress:
        <span id="progressCount">0 without website</span> |
        <span id="scannedCount">0</span> scanned
      </span>

      <button id="btnExport" disabled>📥 CSV</button>
      <button id="btnStop" disabled>⏹️ STOP</button>
      <button id="btnClear">🗑️ Clear</button>
    </div>
  </div>

  <div id="errorMsg" class="error" style="display:none;"></div>
  <div id="successMsg" class="success" style="display:none;"></div>
  <div id="warningMsg" class="warning" style="display:none;"></div>

  <div id="map"></div>

  <div id="stats" style="display:none;"></div>

  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div>
    <div id="spinnerText">Scanning businesses…</div>
    <div id="progressText" style="font-size:14px; opacity:0.8;"></div>
  </div>

  <table id="resultsTable" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Business</th>
        <th>Address</th>
        <th>Phone</th>
        <th>Reviews</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Google Maps loader (key is injected from JS) -->
<script>
  window.GMAPS_API_KEY = "";
</script>
<script src="/assets/gmaps-loader.js" defer></script>

  </main>

  <script src="/assets/app.js" defer></script>
  
  <script src="/assets/map-tool.js" defer></script>
  
</body>
</html>
