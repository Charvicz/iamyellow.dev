<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Planeo — Přehled</title>
  <meta name="description" content="Přehled uložených prodejů za vybraný měsíc." />

  <link rel="stylesheet" href="/assets/style.css">
  

  <link rel="canonical" href="https://iamyellow.dev/planeo/zebricek/" />

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="theme-color" content="#0B0C10">

  <script defer src="/js/smooth-water-ripples.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Go home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Yellow</span>
    </a>

    <nav class="nav">
      <a href="/#focus">Focus</a>
      <a href="/#paths">Explore</a>
      <a href="/projects/">Projects</a>
      <a href="/#links">Links</a>
    </nav>
  </header>
  
  <canvas class="water-ripples" 
        style="width:100%; height:400px; display:block; margin:20px 0; cursor: crosshair;">

  <main id="top" style="padding-top: 70px;">
    
<section class="rank">
  <header class="rank__header">
    <h1>Přehled prodejů</h1>
    <p class="sub">Souhrn tvých uložených prodejů za vybraný měsíc.</p>
  </header>

  <div class="rank__controls">
    <label class="field">
      <span>Měsíc</span>
      <input id="monthPick" type="month">
    </label>

    <label class="field">
      <span>Moje jméno (volitelné)</span>
      <input id="name" type="text" placeholder="např. Yellow">
    </label>

    <div class="rank__btns">
      <button id="exportBtn" class="btn" type="button">Export JSON</button>

      <label class="btn btn--ghost fileBtn">
        Import JSON
        <input id="importFile" type="file" accept="application/json">
      </label>

      <button id="wipeBtn" class="btn btn--danger" type="button">Smazat data</button>
    </div>
  </div>

  <!-- KPIs -->
  <div id="kpis" class="kpis"></div>

  <!-- 2-panely layout -->
  <div class="rank__two">
    <div class="panel">
      <h2>Uložené prodeje</h2>
      <div id="list" class="list"></div>
    </div>

    <div class="panel">
      <h2>Souhrn pilířů</h2>
      <div id="pillars" class="pillars"></div>
    </div>
  </div>
</section>

<link rel="stylesheet" href="/assets/planeo-zebricek.css">
<script src="/assets/planeo-zebricek.js"></script>

  </main>

  <script src="/assets/app.js" defer></script>
  
</body>
</html>
