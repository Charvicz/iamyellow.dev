<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Onboarding</title>
  <meta name="description" content="A clean hub for my work: drone, video, and projects." />

  <link rel="stylesheet" href="/assets/style.css">
  

  <link rel="canonical" href="https://iamyellow.dev/planeo/onboarding/" />

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="theme-color" content="#0B0C10">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Go home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Yellow</span>
    </a>

    <nav class="nav">
      <a href="/#focus">Focus</a>
      <a href="/#paths">Explore</a>
      <a href="/projects/">Projects</a>
      <a href="/#links">Links</a>
    </nav>
  </header>

  <main id="top" style="padding-top: 70px;">
    
<section class="onb">
  <div class="onb__wrap">
    <h1 class="onb__title">Ještě 2 rychlý otázky 👇</h1>
    <p class="onb__sub">Ať víme, odkud jsi a co děláš.</p>

    <div class="onb__card">
      <div class="field">
        <span>Pobočka</span>
        <select id="branch"></select>
      </div>

      <div class="field">
        <span>Pozice</span>
        <select id="role">
          <option value="vedouci">Vedoucí prodejny</option>
          <option value="zastupce">Zástupce vedoucího</option>
          <option value="admin">Administrativní pracovník</option>
          <option value="prodavac">Prodavač</option>
          <option value="logistik">Logistik</option>
          <option value="jine">Jiné</option>
        </select>
      </div>

      <button class="onb__btn" id="saveBtn">Uložit</button>
      <div class="onb__err" id="err" hidden></div>
    </div>
  </div>
</section>

  </main>

  <script src="/assets/app.js" defer></script>
  
</body>
</html>
