<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Planeo — Přihlášení</title>
  <meta name="description" content="A clean hub for my work: drone, video, and projects." />

  <link rel="stylesheet" href="/assets/style.css">
  

  <link rel="canonical" href="https://iamyellow.dev/planeo/login/" />

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="theme-color" content="#0B0C10">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Go home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Yellow</span>
    </a>

    <nav class="nav">
      <a href="/#focus">Focus</a>
      <a href="/#paths">Explore</a>
      <a href="/projects/">Projects</a>
      <a href="/#links">Links</a>
    </nav>
  </header>

  <main id="top" style="padding-top: 70px;">
    
<section style="max-width:420px;margin:80px auto;padding:24px">
  <h1>Přihlášení</h1>
  <p>Zadej své číslo a PIN</p>

  <label class="field">
    <span>Telefon / ID</span>
    <input id="phone" type="tel" placeholder="např. 777123456">
  </label>

  <label class="field">
    <span>PIN (4 čísla)</span>
    <input id="pin" type="password" inputmode="numeric" maxlength="4">
  </label>

  <button id="loginBtn" class="btn btn--big">Přihlásit</button>

  <div id="err" style="margin-top:12px;color:#ff6b6b"></div>
</section>

<script type="module" src="/assets/planeo-login.js"></script>

  </main>

  <script src="/assets/app.js" defer></script>
  
</body>
</html>
