<html lang="en">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Planeo PZ kalkulačka</title>
  <meta name="description" content="Spočítá rozdíl ceny vs. trh a ukáže, jaké PZ se vejdou." />

  <link rel="stylesheet" href="/assets/style.css">
  

  <link rel="canonical" href="https://iamyellow.dev/planeo/pz/" />

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="theme-color" content="#0B0C10">

  <script defer src="/js/smooth-water-ripples.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Go home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>Yellow</span>
    </a>

    <nav class="nav">
      <a href="/#focus">Focus</a>
      <a href="/#paths">Explore</a>
      <a href="/projects/">Projects</a>
      <a href="/#links">Links</a>
    </nav>
  </header>

  <main id="top" style="padding-top: 70px;">
    
<section class="pz">
  <header class="pz__header">
    <h1>Planeo PZ</h1>
    <p class="sub">
      Zadej ceny → dostaneš rozdíl + PZ varianty podle kategorie a cenového pásma.
    </p>
  </header>

  <div class="pz__card">
    <div class="pz__grid">
      <label class="pz__field">
        <span>Kategorie</span>
        <select id="category"></select>
      </label>

      <label class="pz__field">
        <span>Cena v Planeu (Kč)</span>
        <input
          id="planeoPrice"
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="např. 12990"
        >
      </label>

      <label class="pz__field">
        <span>Nejnižší cena na trhu (Kč)</span>
        <input
          id="marketPrice"
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="např. 11990"
        >
      </label>

      <div class="pz__actions">
        <button id="calcBtn" class="btn">Spočítat</button>

        <button
          id="resetBtn"
          class="btn btn--ghost"
          type="button"
        >
          Reset
        </button>
      </div>
    </div>

    <div
      class="pz__summary"
      id="summary"
      hidden
    ></div>
  </div>

  <!-- PZ -->
  <div
    class="pz__results"
    id="results"
  ></div>

  <!-- PNP -->
  <div class="pz__results pz__results--pnp">
    <div id="pnpResults"></div>
  </div>

<!-- NEW: COMBO RESULTS -->
  <div class="pz__results" id="comboResults"></div>
  
  <footer class="pz__footer">
    <p class="hint">
      Tip: Rozdíl = <b>Planeo − trh</b>.
      Když je rozdíl ≤ 0,
      tak se “do rozdílu” nevejde nic.
    </p>
  </footer>
</section>

<link rel="stylesheet" href="/assets/pz.css">

<script src="/assets/pz.js"></script>
  </main>

  <script src="/assets/app.js" defer></script>
  
</body>
</html>
